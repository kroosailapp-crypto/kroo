<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body style="margin:0;padding:0;background:#F4F7FA;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#F4F7FA;padding:32px 0">
  <tr><td align="center">
  <table width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#FFFFFF;border-radius:12px;overflow:hidden">
    <tr><td style="background:#123251 url('https://www.kroosail.com/patterns/windmap-hero.svg') repeat;background-size:1100px auto;padding:32px 40px">
      <img src="https://www.kroosail.com/logos/kroo-finder-white.png" alt="Kroo Finder" height="32" style="display:block">
      <div style="margin-top:16px;font-size:12px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#45B589">Confirm your email</div>
    </td></tr>
    <tr><td style="padding:40px 40px 48px">
      <h2 style="margin:0 0 16px;font-size:22px;font-weight:800;color:#123251">One last step</h2>
      <p style="margin:0 0 24px;font-size:15px;line-height:1.65;color:#3A424D">Confirm your email address to finish creating your Kroo Finder account.</p>
      <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:12px 24px;border-radius:10px;background:#14764F;color:#FFFFFF;font-size:15px;font-weight:700;text-decoration:none">Confirm email</a>
    </td></tr>
    <tr><td style="background:#F4F7FA;padding:24px 40px 32px">
      <p style="margin:0;font-size:13px;color:#565E69">If you didn't sign up, you can safely ignore this email.</p>
      <p style="margin:8px 0 0;font-size:13px;color:#565E69">Kroo Finder · kroosail.com</p>
    </td></tr>
  </table>
  </td></tr>
</table>
</body>
</html>
